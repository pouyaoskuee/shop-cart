<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>shop cart</title>
</head>
<body>

<header>
    <div class="header__container">
        <div class="header__hamburger">
            <div class="hamburger__div1"></div>
            <div class="hamburger__div2"></div>
            <div class="hamburger__div3"></div>
        </div>
        <div class="header__title">
            <h3>shop cart</h3>
        </div>
        <div class="header__cart-icon">
            <svg class="header__cart-svg">
                <use xlink:href="/assets/images/sprite.svg#cart"></use>
            </svg>
            <div class="header__cart-count">0</div>
        </div>
    </div>
</header>


<main class="products">
    <!--   home page content    -->
</main>

<div class="backdrop hidden"></div>
<section class="modals hidden">
    <div class="modal__card">
        <div class=modal__title>
            <h3>your cart</h3>
        </div>

        <div class="modal__products">
            <!--  modal content    -->
        </div>

        <div class="modal__total">
            <p class="modal__total--price">total price:<span>0</span></p>
            <div class="modal__total--buttons">
                <button class="modal__button-clear">clear cart</button>
                <button class="modal__button-confirm">confirm</button>
            </div>
        </div>
    </div>

</section>


<script type="module" src="./js/main.js"></script>
</body>
</html>
